# Cataloghi prodotti prato / giardino — Italia (ingest → prodotti_mercato)

sites:
  - id: best_prato
    label: Best Prato
    default_brand: Best Prato
    url_list: urls_bestprato.txt
    also_lists:
      - urls_bestprato_fito.txt

  - id: bottos
    label: Bottos 1848
    default_brand: BOTTOS
    sitemap: https://www.bottos1848.com/sitemap_index.xml
    path_must_contain:
      - bottos1848.com
      - /categorie/
      - fungic
      - bioattiv
      - concim
      - prato
      - sement
    seed_urls:
      - https://www.bottos1848.com/categorie/bioattivati/

  - id: agrieuro_prato
    label: Agrieuro
    default_brand: Agrieuro
    domain: agrieuro.com
    crawl_max_pages: 200
    product_url_regex: "agrieuro\\.com/[a-z0-9-]+/\\d{3,}-[a-z0-9-]+\\.html"
    seed_urls:
      - https://www.agrieuro.com/categoria/37-prato-giardino.html
      - https://www.agrieuro.com/categoria/38-concimi-fertilizzanti.html
      - https://www.agrieuro.com/categoria/39-seminatrici.html
      - https://www.agrieuro.com/categoria/40-irrigazione-giardino.html
      - https://www.agrieuro.com/categoria/41-attrezzi-giardino.html

  - id: zapi
    label: Zapi Garden
    default_brand: ZAPI
    domain: zapi.it
    crawl_max_pages: 120
    product_url_regex: "zapi\\.it/(it/)?[a-z0-9-]+/(prato|diserb|concim|fungic|insettic|erbic|nutriz|prodott)"
    seed_urls:
      - https://www.zapi.it/
      - https://www.zapi.it/it/prodotti-per-il-giardino
      - https://www.zapi.it/it/prato
      - https://www.zapi.it/it/diserbanti
      - https://www.zapi.it/it/concimi

  - id: compo_expert
    label: COMPO Expert
    default_brand: COMPO Expert
    domain: compo-expert.com
    crawl_max_pages: 150
    product_url_regex: "compo-expert\\.com/it-IT/(prodotti|colture|gruppi-di-prodotti)"
    seed_urls:
      - https://compo-expert.com/it-IT/colture/tappeti-erbosi-manutenzione-del-verde
      - https://compo-expert.com/it-IT/gruppi-di-prodotti
      - https://compo-expert.com/it-IT/colture/tappeti-erbosi-manutenzione-del-verde/paesaggistica-e-spazi-verdi
      - https://compo-expert.com/it-IT/colture/tappeti-erbosi-manutenzione-del-verde/tappeti-erbosi-sportivi

  - id: barenbrug
    label: Barenbrug
    default_brand: BARENBRUG
